repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: forbid-secrets
        name: Forbid secrets in codebase
        entry: python scripts/check_secrets.py
        language: python
        files: \.(py|js|ts|tsx|json|yaml|yml|md)$
        exclude: ^\.env$|^scripts/check_secrets\.py$
        pass_filenames: true
