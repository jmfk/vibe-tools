[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-tools"
version = "0.0.64"
dependencies = [
    "click",
    "google-genai",
    "pyyaml",
    "rich",
    "pydantic",
    "prompt_toolkit",
    "python-dotenv",
    "httpx",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]

[project.scripts]
vibe = "vibe_tools.cli:cli"
vibe-setup = "vibe_tools.setup:setup_cli"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
