[project]
name = "vibe-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "google-generativeai",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [".git", "implementation"]
