[project]
name = "vibe-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "google-generativeai",
    "pyyaml",
    "python-dotenv",
]

[project.scripts]
vibe = "vibe_tools.cli:cli"

[project.entry-points.pytest11]
vibe_tools = "vibe_tools.pytest_plugin"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [".git", "implementation"]
