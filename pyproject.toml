[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-tools"
version = "0.1.0"
description = "Global commands for Cursor Ralph loop and coverage improvement"
requires-python = ">=3.8"
dependencies = [
    "click",
]

[tool.setuptools]
packages = ["vibe_tools"]

[project.scripts]
vibe = "vibe_tools.cli:cli"

