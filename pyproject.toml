[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-tools"
dynamic = ["version"]
dependencies = [
    "click",
    "google-genai",
    "pyyaml",
    "rich",
    "pydantic",
    "prompt_toolkit",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools_scm]
write_to = "vibe_tools/version.py"
