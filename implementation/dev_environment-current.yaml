SYSTEM_CONTRACT:
  Architecture: CLI-first
  Primary_Stack:
    Backend: Python-based
    Frontend: React-based
  Control_Interfaces:
  - Makefile
  - vibe
  - vibe-servers
  - vibe-setup
  Orchestration_Systems:
  - Docker
  - Skaffold
  - Helm
  Infrastructure_Services:
    PostgreSQL:
      Port: 5432
      Extensions: pgvector
    Redis:
      Port: 6379
    MinIO:
      Ports:
      - 9000
      - 9001
      - 9010
      - 9011
    RabbitMQ:
      Ports:
      - 5672
      - 15672
    Elasticsearch:
      Port: 9200
    MailHog:
      Ports:
      - 1025
      - 8025
    Imgproxy:
      Port: 8080
  Configuration_Management:
    Method: .env files
    Setup_Tool: vibe-setup env
    Variables:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - Database connection strings
    - S3 credentials
  Access_Endpoints:
    Frontend: http://localhost:5173
DOMAIN_MODEL:
  Backend:
    Language: Python 3.9+
    Package_Specification: pyproject.toml
    Primary_Libraries:
    - click
    - rich
    - ruff
    - mypy
    Build_Method: pip install -e .
  Frontend:
    Technology: React/TypeScript
    Environment: Node.js
    Package_Specification: frontend/package.json
  Containerization:
    Backend_Dockerfile: deployment/Dockerfile
    Frontend_Dockerfile: frontend/Dockerfile
  Kubernetes_Deployment:
    Local_Tools:
    - Minikube
    - Kind
    Skaffold_Config: skaffold dev
    Helm_Charts:
      Path: charts/vibe-tools
      Configuration:
      - values.yaml
      - values-prod.yaml
CAPABILITIES:
  Environment_Setup:
  - vibe-setup env
  Service_Orchestration:
  - vibe-servers start all
  - vibe-servers status
  - vibe-servers list
  Build_Operations:
  - make build
  - make build-backend
  - make build-frontend
  - make docker-build
  Testing_Operations:
  - make test
  - make test-backend
  - make test-frontend
  - make test-integration
  Development_Workflow:
  - make dev
  - make dev-start
  - make dev-stop
  - make dev-restart
  - skaffold dev
  Linting_Operations:
  - make lint
  - make lint-backend
  - make lint-frontend
  Coverage_Reporting:
  - make coverage
  - make coverage-backend
  - make coverage-frontend
  Cleanup_Operations:
  - make clean
  - make clean-backend
  - make clean-frontend
  Installation_Operations:
  - make install
  - make install-backend
  - make install-frontend
  Verification_Steps:
  - vibe --help
  - vibe-servers list
  - npm run test
  - existence check of frontend/dist/
  - vibe-servers status
  - make test
  CI_CD_Pipeline:
  - Lint
  - Test
  - Build
  - Publish
  - Deploy
OUTPUT_TARGETS:
  Backend: Python package installed in the virtual environment
  Frontend: Production build in frontend/dist/
  Docker: Primary application image
  CI_CD: Updated Helm release in target environment
