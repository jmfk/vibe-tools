SYSTEM_CONTRACT:
  idempotency: Normalizing same file multiple times should produce consistent results.
  information_preservation: All information from markdown must be preserved in YAML.
  yaml_structure: Output must match expected PRD YAML schema.
  error_handling: Graceful handling of invalid markdown, agent failures, YAML errors.
  naming_normalization: Strips leading "prd" markers, normalizes dashes/spaces to underscores.
  overwrite_protection:
    yes_mode: '--yes: Auto-overwrite existing files'
    no_mode: '--no: Skip existing files'
    default_mode: 'Default: Ask per file'
  validation:
    syntax_check: Checks YAML syntax.
    field_check: Verifies required fields present.
    issue_handling: Warns on potential issues.
  success_criteria:
  - All spec types successfully normalized
  - YAML structure matches expected format
  - Global truth files handled correctly
  - Overwrite protection works
  - Batch processing completes successfully
  - Validation catches errors
  acceptance_tests:
  - Single File: Normalize one spec file, verify YAML created correctly
  - Batch Processing: Normalize all specs, verify all converted
  - Overwrite Protection: Try to normalize existing file, verify prompt/behavior
  - Global Truth: Normalize architecture.md, verify architecture.yaml created (not prd_architecture.yaml)
  - Naming: Normalize files with various names, verify correct YAML names
  - Validation: Create invalid spec, verify error handling
  - Information Preservation: Compare markdown and YAML, verify all info present
  - Idempotency: Normalize same file twice, verify consistent output
DOMAIN_MODEL:
  input: Markdown specification files (.md) in specs/ directory.
  output: YAML PRD files (.yaml) in implementation/prds/ directory.
  prompt_template: prompts/prd_normalization_prompt.txt
  ai_agent: Configured agent for conversion.
  global_truth_files:
  - architecture.md
  - infrastructure.md
  - cicd.md
  - testing.md
  - project_overview.md
CAPABILITIES:
  file_discovery: Finds all .md files in specs/ directory (recursive), or processes specified file(s).
  conversion_process: Reads markdown spec, loads prompt template, calls AI agent, generates YAML, validates structure, saves to destination.
  batch_processing: Efficient processing of multiple files with progress indication.
  overwrite_protection: Supported modes are ask, yes, and no.
  global_truth_handling: Maps specific markdown files to non-prd-prefixed YAML files.
  naming_convention: Implementation PRDs (prd_{stem}.yaml) vs Global truths ({stem}.yaml).
  validation: Checks YAML syntax, verifies required fields, and warns on potential issues.
  cli_interface: vibe normalize command with progress output.
OUTPUT_TARGETS:
  destination: implementation/prds/
  implementation_prds: prd_{stem}.yaml
  global_truths: '{stem}.yaml'
_vibe_sync:
  issue_number: 64
TITLE: 08 Normalization
BRANCH: feature/prd_08_prd_normalization
PARENT_BRANCH: main
