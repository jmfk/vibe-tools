SYSTEM_CONTRACT: MISSING
DOMAIN_MODEL:
- message: A message to be processed by the LLM.
- queue: A list of messages to be processed by the LLM in order.
CAPABILITIES:
- Direct LLM Loop Integration:
  - Move from `cursor-agent` wrapper to a direct `run_llm` style loop optimized for
    Gemini 3 Flash.
  - Use `gemini-2.0-flash-exp` (aliased as `gemini-3-flash`) for the fastest possible
    response times.
- Streaming Response:
  - The interactive shell should display characters as they are received from the
    LLM.
  - Maintain terminal styling while streaming.
- Advanced Interaction Controls (Ctrl Commands):
  - Ctrl-C: Interrupt current LLM generation.
  - Ctrl-Q: (Optional/Configurable) Clear the current queue.
  - Stop: Explicit command or key combo to stop the current question/response.
- Message Queuing System:
  - Interruption: If the LLM is busy, new messages are added to the queue by default.
  - Push: A special command or flag (e.g., `/push` or a modifier) that stops the current
      LLM task and starts processing the new one immediately.
  - Cancellation: Ability to view and remove items from the pending queue.
OUTPUT_TARGETS:
- The interactive shell should display characters as they are received from the LLM.
