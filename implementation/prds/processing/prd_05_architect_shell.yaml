SYSTEM_CONTRACT:
- Interactive shell with readline support (tab completion, history)
- Two interaction modes: ASK (default) and AGENT
- Session persistence between invocations
- Context file management
- Session memory for persistent instructions
- External editor integration for specs and code
- Slash command navigation and control
- Mode safety: ASK mode prevents file modifications, AGENT mode authorized for updates
- Integration with run_agent() for prompt dispatch
- Readline compatibility with GNU readline and macOS libedit
- Graceful error handling for missing files, invalid commands, and agent failures
DOMAIN_MODEL:
  session:
    history: conversation log
    pending_prompt: accumulated multi-line input
    session_memory: persistent instructions
    additional_files: attached context files
    mode: interaction mode (ASK or AGENT)
  interaction_modes:
  - ASK
  - AGENT
  spec_files:
  - specs/architecture.md
  - specs/infrastructure.md
  configuration:
    editors:
    - markdown
    - code
  agent_processes: running processes
CAPABILITIES:
- interactive_loop: Main loop for input reading, slash command handling, and multi-line prompt accumulation
- slash_commands:
  - /send, /s: Dispatch pending prompt to agent
  - /reset, /r: Clear session memory and pending prompt
  - /add, /a: Add persistent instructions to session memory
  - /mode, /m: Switch between ASK and AGENT modes
  - /files, /f: Manage context files (list, add, remove)
  - /list, /l: View pending prompt, session memory, and history
  - /conf: Configure external editors for markdown and code
  - /show: Display current architecture or infrastructure specs
  - /edit: Open spec file in configured external editor
  - /history: Manage conversation history (list, view, remove)
  - /ps: Show running agent processes
  - /kill: Terminate agent processes
  - /help, /h: Display help information
  - /exit, /q: Terminate shell session
- session_persistence: Automatic saving/loading of session state to JSON
- agent_integration: Context injection including specs, session memory, and attached files into agent calls
- readline_support: Command completion, multi-line support, and history persistence
- editor_integration: Launching external editors for specification files and response code
OUTPUT_TARGETS:
- implementation/architect-session.json
- implementation/.architect_history
- implementation/architect-config.json
- specs/architecture.md
- specs/infrastructure.md
TITLE: 05 Architect Shell
BRANCH: feature/prd_05_architect_shell
PARENT_BRANCH: main
