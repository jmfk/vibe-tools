SYSTEM_CONTRACT: MISSING
DOMAIN_MODEL:
- name: PRD
  attributes:
  - name: Status
    possible_values:
    - inbox
    - backlog
    - history
    - trash
CAPABILITIES:
- name: PRD Migration
  description: Transition existing projects to the new directory structure.
  commands:
  - name: vibe migrate
    behavior:
    - Creates the product/{inbox,backlog,history,trash} directories.
    - Reads implementation/state.json to identify completed_prds and moves corresponding
      files from implementation/prds/ to product/history/.
    - Moves all other PRDs from implementation/prds/ to product/backlog/.
    - If vibe-tools-prds/ exists (legacy), it should also be considered during migration.
    idempotency: The command should be safe to run multiple times. It should skip
      files already in the target directories.
- name: PRD Management and Viewing
  description: Hub for PRD management.
  commands:
  - name: vibe i [all|inbox|backlog|history|trash]
    behavior:
    - Lists PRDs in the specified folder (defaults to backlog if no subcommand is
      provided).
    - Paging: Display items in batches of 10.
    - Search: Accepts an optional search term to filter results by filename.
  - name: vibe implement move <id> <target_folder>
    behavior:
    - Moves a PRD (identified by ID or partial name) from its current folder to the
      target folder.
    supported_targets:
    - inbox
    - backlog
    - history
    - trash
  - name: vibe implement dismiss <id>
    behavior: Shortcut for vibe implement move <id> trash.
  - name: vibe implement edit <id>
    behavior: Opens the specified PRD in the configured editor.
- name: Configuration
  description: Configuration option for editor.
  options:
  - name: editor
    possible_values:
    - cursor
    - typora
    - code
    - vim
    - etc.
    usage: When vibe implement edit is called, it spawns the configured editor process.
- name: Implementation Loop Updates
  description: MISSING
  behavior:
  - Look for machine-readable PRDs in product/backlog/.
  - Upon successful implementation of a PRD, move the file from backlog/ to history/.
OUTPUT_TARGETS: MISSING
