SYSTEM_CONTRACT:
  Purpose: Automated test coverage improvement
  Success_Criteria:
  - Loop improves test coverage
  - Reaches target percentages
  - Generates valid tests
  - Maintains test suite health
  Constraints:
  - Generated tests must be meaningful (not coverage padding)
  - Tests must be maintainable and follow project patterns
  - Regression prevention (new tests must not break existing functionality)
  - Iteration limits to prevent infinite loops
  - Support for backend, frontend, and combined coverage
  Input: MISSING
  SLA: MISSING
DOMAIN_MODEL:
  Component:
    Types:
    - backend
    - frontend
    - all
  Coverage_Report:
    Attributes:
    - total coverage percentage
  Improvement_Target:
    Calculation_Formula: current_cov + (0.3 * (100 - current_cov))
  AI_Agent:
    Functions:
    - generate tests
    - fix failing tests
  Test_Suite:
    Components:
    - new tests
    - existing tests
  Iteration:
    Parameters:
    - current coverage
    - target coverage
    - max iterations
  Cost_Log:
    Attributes:
    - agent calls
CAPABILITIES:
  Coverage_Measurement:
    Method: ProjectTester.get_coverage_report()
    Process:
    - Discover coverage command (make coverage, pytest --cov, npm test:coverage)
    - Run coverage for specified component
    - Parse coverage report
    - Extract total coverage percentage
  Target_Calculation:
    Strategy: 30% of remaining gap per iteration
  Improvement_Loop:
    Steps:
      1: Measure current coverage
      2: Exit if coverage >= 100%
      3: Calculate target coverage
      4: Build improvement prompt with coverage report
      5: Call AI agent to generate tests
      6: Verify tests pass (run test suite)
      7: If tests fail, ask agent to fix
      8: Measure new coverage
      9: Continue if improved, else may exit
      10: Repeat until target or max iterations reached
  Prompt_Building:
    Template: coverage_improvement_prompt.txt
    Contents:
    - current coverage report
    - target coverage
    - codebase context
  Test_Verification:
    Requirements:
    - New tests pass
    - Existing tests still pass
    - No regressions introduced
  Cost_Tracking:
    Action: Logs all agent calls
  Progress_Tracking:
    Interface: CLI command with progress output
OUTPUT_TARGETS:
- Improved test coverage
- Valid and meaningful tests
- Progress communication
- Agent call logs for cost tracking
