SYSTEM_CONTRACT:
  interface: CLI interactive shell interface
  readline_support: true
  session_storage: project/pm-session.json
  history_storage: project/.pm_history
  config_storage: project/pm-config.json
  spec_files_location: specs/ directory
  slash_commands:
  - /send, /s: Dispatch prompt (includes focused PRD context if set)
  - /reset, /r: Clear session
  - /add, /a <text>: Add session memory
  - /mode, /m [ASK|AGENT]: Switch modes
  - /files, /f [list|add|remove]: Manage context files
  - /focus, /switch <prd_id>: Focus on specific PRD
  - /implemented, /i: Show implementation status
  - /create <name>: Create new spec
  - /delete <name>: Delete spec
  - /list, /ls [memory|specs]: List memory or specs
  - /show specs: Show spec list
  - /history: Standard command
  - /ps: Standard command
  - /kill: Standard command
  - /help: Standard command
  - /exit: Standard command
  editor_integration: true
  error_handling: Graceful handling of missing PRDs, invalid spec names, file errors
DOMAIN_MODEL:
  focused_prd: Currently focused PRD ID
  spec_files: Markdown files in specs/
  session_persistence_data:
  - History
  - Pending prompt
  - Session memory
  - Additional files
  - Mode
  - focused_prd
  agent_context:
  - Focused PRD context
  - Spec files
  - Session memory
  - Attached files
  implementation_status: Tracking of which PRDs are implemented
CAPABILITIES:
- Interactive shell with readline support
- PRD focus mode (work on specific PRD)
- Spec file management (create, list, delete, show)
- Implementation status tracking
- Session persistence
- Context file management
- Editor integration
- Slash commands for PRD operations
- Agent integration (includes focused PRD context, spec files, session memory, attached files in agent prompts)
- Integration with vibe normalize and vibe implement
OUTPUT_TARGETS:
- project/pm-session.json
- project/.pm_history
- project/pm-config.json
- specs/
TITLE: 06 Pm Shell
BRANCH: feature/prd_06_pm_shell
PARENT_BRANCH: main
