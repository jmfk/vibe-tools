SYSTEM_CONTRACT:
  idempotency: Safe to run multiple times (sync detection)
  iteration_limits: Max iterations prevent infinite loops
  branch_isolation: Each loop runs on dedicated branch
  error_handling: Graceful handling of agent failures, file errors, git errors
  completion_detection: Relies on agent including <promise>DONE</promise>
DOMAIN_MODEL:
  RalphLoop:
    desired_file: Path to desired state (YAML PRD or spec)
    current_file: Path to current state (actual implementation)
    name: Loop name (for logging)
    agent: Agent backend to use
    branch_name: Git branch for changes
    max_iterations: Maximum reconciliation attempts
  Modes:
    MIGRATION: Current file exists, needs updating
    INITIALIZATION: Current file missing, needs creation
  SyncDetection: Uses file hashes to detect if desired and current are already in sync
CAPABILITIES:
- Desired vs current state comparison
- Iterative agent-driven reconciliation
- Branch management for isolated changes
- Completion promise detection
- Multi-phase support (architecture, infrastructure, implementation)
- Custom instruction injection
- Git commit integration
- Sync detection using file hashes
- Mode detection (MIGRATION or INITIALIZATION)
- Logging of reconciliation steps
OUTPUT_TARGETS:
- File System (Reads/writes desired and current state files)
- Git (Branch switching, committing changes)
- Agent Backend (Calls configured agent)
- Logging (Comprehensive logging of steps)
