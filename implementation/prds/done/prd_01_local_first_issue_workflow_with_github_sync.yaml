SYSTEM_CONTRACT:
- LOCAL_FIRST_ISSUE_MANAGEMENT: true
- FILE_BASED_ARTIFACTS: true
- GITHUB_SYNCHRONIZATION_TARGET: true
- DETERMINISTIC_RECONCILIATION: true
- AGENT_CONSUMABLE: true
- NO_SILENT_MERGES: true
- CANONICAL_LOCAL_IDENTITY: true
DOMAIN_MODEL:
  Issue:
    id: STRING (ISSUE-YYYY-MM-DD-XXX)
    title: STRING
    status:
    - backlog
    - in_progress
    - blocked
    - done
    severity:
    - low
    - medium
    - high
    - critical
    service: STRING
    created_at: TIMESTAMP
    updated_at: TIMESTAMP
    github:
      repo: STRING
      number: INTEGER
      url: STRING
    sync:
      last_synced_at: TIMESTAMP
      sync_hash: STRING
    body:
      summary: STRING
      reproduction_steps: STRING
      expected_behavior: STRING
      actual_behavior: STRING
      evidence: STRING
      acceptance_criteria: STRING
      investigation_notes: STRING
      solution_notes: STRING
  SyncState:
    mappings: MAP
    metadata: MAP
  StatusMapping:
    backlog:
      github_state: open
      label: []
    in_progress:
      github_state: open
      label: in-progress
    blocked:
      github_state: open
      label: blocked
    done:
      github_state: closed
      label: resolved
CAPABILITIES:
  vibe_issue_sync:
    description: Synchronize local issues with GitHub.
    options:
    - --dry-run
    - --full
    - --since
    - --open-only
    - --label
    actions:
    - pull_new_issues
    - push_local_changes
    - update_metadata
    - detect_conflicts
    conflict_handling:
    - mark_blocked
    - create_conflict_note
    - require_human_resolution
  vibe_issue_investigate:
    description: Create issues via guided investigation.
    actions:
    - read_logs
    - cluster_errors
    - propose_issues
    - generate_issue_files
    - create_github_issues
    rules:
    - user_confirmation_required
    - redacted_logs
  vibe_issue_solve:
    description: Resolve issue via agent-driven loop.
    modes:
    - investigate
    - solve
    actions:
    - read_issue
    - inspect_codebase
    - run_tests
    - modify_code
    - update_notes
    - transition_status
    - close_issue
  agent_interaction:
    requirements:
    - update_updated_at
    - update_status
    - append_notes
    - preserve_evidence
    - preserve_severity_scope
OUTPUT_TARGETS:
  directory_structure:
    issues/backlog/: Active issues
    issues/history/: Resolved issues
    issues/meta/index.json: Machine-managed sync state
  file_format: Markdown with YAML frontmatter
  github_sync:
    authority_local:
    - Title
    - Body
    - Status
    - Labels
    - vibe-bot comments
    authority_github:
    - External comments
    - Reactions
    - Mentions
_vibe_sync:
